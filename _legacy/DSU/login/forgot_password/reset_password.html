<!doctype html>
<html lang="en">
<head>
	<title>Reset Password — RMU Asset Register</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="css/style.css">
	<style>
		.reset-hint { font-size:.8rem; color:rgba(255,255,255,0.6); margin-top:.25rem; display:block; }
		.form-control { margin-bottom:.25rem; }
	</style>
</head>
<body class="img js-fullheight" style="background-image: url(images/bg.jpg);">
<section class="ftco-section">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-4">
				<div class="login-wrap p-0">
					<h3 class="mb-2 text-center">Reset Password</h3>
					<p class="text-center" style="color:rgba(255,255,255,0.7);font-size:.88rem;margin-bottom:1.5rem;">
						Enter the code shown on the previous screen along with your new password.
					</p>
					<form action="reset_password.inc.php" method="POST" class="signin-form">

						<div class="form-group">
							<input type="text" class="form-control" placeholder="Your username"
							       name="username" required autocomplete="username">
						</div>

						<div class="form-group">
							<input type="text" class="form-control" placeholder="Reset code (e.g. A3KH7X)"
							       name="reset_code" required autocomplete="off"
							       style="text-transform:uppercase;letter-spacing:.12em;">
							<span class="reset-hint">The 6-character code from the previous alert.</span>
						</div>

						<div class="form-group">
							<input type="password" class="form-control" placeholder="New password (min. 8 characters)"
							       name="new_password" required minlength="8" autocomplete="new-password">
						</div>

						<div class="form-group">
							<input type="password" class="form-control" placeholder="Confirm new password"
							       name="confirm_password" required minlength="8" autocomplete="new-password">
						</div>

						<div class="form-group">
							<button type="submit" name="resetPassword"
							        class="form-control btn btn-primary submit px-3">
								Set New Password
							</button>
						</div>

						<div class="form-group d-md-flex">
							<div class="w-50">
								<a href="index.html" style="color:rgba(255,255,255,0.7);font-size:.85rem;">&larr; Back</a>
							</div>
							<div class="w-50 text-md-right">
								<a href="../index.html" style="color:rgba(255,255,255,0.7);font-size:.85rem;">Log In</a>
							</div>
						</div>

					</form>
				</div>
			</div>
		</div>
	</div>
</section>
<script src="js/jquery.min.js"></script>
<script src="js/popper.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/main.js"></script>
<script>
	document.querySelector('[name="reset_code"]').addEventListener('input', function() {
		const pos = this.selectionStart;
		this.value = this.value.toUpperCase();
		this.setSelectionRange(pos, pos);
	});
	document.querySelector('form').addEventListener('submit', function(e) {
		const np = this.querySelector('[name="new_password"]').value;
		const cp = this.querySelector('[name="confirm_password"]').value;
		if (np !== cp) { e.preventDefault(); alert('Passwords do not match. Please try again.'); }
	});
</script>
</body>
</html>
